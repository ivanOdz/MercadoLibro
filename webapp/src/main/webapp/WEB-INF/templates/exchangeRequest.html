<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="#{email.subject}"></title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px;">
  <p th:text="#{email.greeting}" style="font-size: 18px; font-weight: bold;"></p>
  <p th:text="#{email.message}" style="font-size: 16px;"></p>

  <p>
    <strong th:text="#{email.requesterName}" style="font-size: 16px; font-weight: bold;"></strong>
    <span th:text="${requesterName} (${requesterEmail})" style="font-size: 16px;"></span>
  </p>

  <!-- Datos del libro solicitado -->
  <p>
    <strong th:text="#{email.requestedPublication}" style="font-size: 16px; font-weight: bold;"></strong>
    <span th:text="${requestedPublication}" style="font-size: 16px;"></span>
  </p>

  <!-- Datos del libro ofrecido -->
  <p>
    <strong th:text="#{email.offeredPublication}" style="font-size: 16px; font-weight: bold;"></strong>
    <span th:text="${offeredPublication}" style="font-size: 16px;"></span>
  </p>

  <p th:text="#{email.actionMessage}" style="font-size: 16px;"></p>

  <!-- Botón de Rechazar -->
  <a th:href="@{${rejectionUrl}}"
     style="display: inline-block; padding: 10px 20px; font-size: 16px; color: #ffffff; background-color: #dc3545; text-decoration: none; border-radius: 5px; text-align: center; margin-top: 20px; margin-left: 10px;"
     th:text="#{email.rejectButton}">
  </a>

  <!-- Botón de Validar -->
  <a th:href="@{${validationUrl}}"
     style="display: inline-block; padding: 10px 20px; font-size: 16px; color: #ffffff; background-color: #28a745; text-decoration: none; border-radius: 5px; text-align: center; margin-top: 20px;"
     th:text="#{email.validateButton}">
  </a>

  <p th:text="#{email.thankYouMessage}" style="font-size: 16px; margin-top: 20px;"></p>
</div>
</body>
</html>
