<div class="book-card">
	<img [src]="bookImage" alt="Book Cover" class="book-image" (error)="bookImage = defaultImage">
	  
	<div class="book-info">
		<h3 class="book-title">{{ book.bookModel!.title }}</h3>
		<p *ngIf="showOwner" class="book-owner"><strong>Dueño:</strong> {{ ownerName }}</p>
		<p class="book-state"><strong>Estado:</strong> {{ ('bookstate.' + (book.state! | lowercase)) | translate }}</p>
	</div>
</div>
