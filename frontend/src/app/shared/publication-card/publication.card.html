<div class="publication-card-container" (click)="goToPublicationDetail()">
	<div class="first-column-card">
		<img class="book-image" [src]="getBookImage(publication.book?.images)" alt="book-image"/>
	</div>
	<div class="second-column-card">
		<p class="title-text-card">{{ publication.book?.bookModel?.title }}</p>
		<p class="authors-text-card">{{ publication.book?.bookModel?.authors }}</p>
		<p class="description-text-card">{{ publication.book?.bookModel?.description }}</p>
		<p class="publisher-text-card">{{ publication.book?.bookModel?.editorial }}</p>
	</div>
	<div class="third-column-card"></div>
</div>
