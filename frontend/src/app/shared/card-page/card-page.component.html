<app-navbar></app-navbar>

<div class="page-home">

	<div class="column-filters">
		<p class="page-filter-text">{{ 'FILTERS' | translate }}</p>
		<div class="filter-line"></div>
		<app-filter-list [headers]="conditionHeaders" filterType="Condition" (filterChanged)="onFilterUpdate($event)" [filterApplied]="stateFilterApplied"></app-filter-list>
		<div class="filter-line"></div>
		<app-filter-list [headers]="genreHeaders" filterType="Genre" (filterChanged)="onFilterUpdate($event)" [filterApplied]="genreFilterApplied"></app-filter-list>
		<div class="filter-line"></div>
	</div>
	
	<div class="column-content">

		<p class="page-title">{{ pageTitle | translate }}</p>
		<p-inputgroup *ngIf="showSearchBar">
			<input #searchInput pInputText
					[(ngModel)]="currentFilters.search"
					(keyup.enter)="search()"
					[ngClass]="{ 'search-applied': isSearchActive }"
					(blur)="onBlur()"
					placeholder="{{ 'PUBLICATIONS.SEARCH' | translate }}" />
			<p-inputgroup-addon>
				<p-button icon="pi pi-search" severity="secondary" variant="text" (click)="search()"/>
			</p-inputgroup-addon>
		</p-inputgroup>
		
		<div class="search-info">
			<p>{{ 'TOTAL_RESULTS' | translate }}: {{ totalResults ? totalResults : 0 }}</p>
			<div class="active-filters">
				<div class="filter-left">
					<button *ngIf="currentFilters.state" class="filter-badge" (click)="removeFilter('state')">
						{{ currentFilters.state | translate }} ✕
					</button>
					<button *ngIf="!currentFilters.state" class="no-filter-badge">
						{{ 'NO_STATE_FILTER' | translate }}
					</button>
				</div>
				<div class="filter-right">
					<button *ngIf="currentFilters.genre" class="filter-badge" (click)="removeFilter('genre')">
						{{ currentFilters.genre | translate }} ✕
					</button>
					<button *ngIf="!currentFilters.genre" class="no-filter-badge">
						{{ 'NO_GENRE_FILTER' | translate }}
					</button>
				</div>
			</div>
			<app-sort *ngIf="displaySort" (sortChange)="onSortUpdate($event)"></app-sort>
			<div *ngIf="!displaySort" class="spacer"></div>
		</div>
	
		<div class="content">
			<p-scrollpanel *ngIf="!loading && items.length !== 0" class="scroll-panel" [style]="{ width:'65vw', height: '58vh'}">
	
				<div [ngClass]="{ 'cards-grid': displayGridStyle, 'cards': !displayGridStyle }">
					<ng-container *ngIf="cardTemplate">
						<ng-container *ngFor="let item of items" [ngTemplateOutlet]="cardTemplate" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
					</ng-container>
					<div class="spacer"></div>
				</div>
				
			</p-scrollpanel>
	        
            <ng-template *ngIf="!loading  && items.length === 0" [ngTemplateOutlet]="emptyPageTemplate"></ng-template>
            <div style="height: 64vh;align-content: center;" *ngIf="loading">
                <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '50px', height: '50px' }" />
            </div>
			<app-paginator *ngIf="!firstLoad && items.length !== 0" [pagination]="pagination" [fetchMethod]="fetchItems.bind(this)" [reset]="resetPaginatorNumber"></app-paginator>
        </div>
	</div>
</div>
