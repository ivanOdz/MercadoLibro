<div class="pagination-container" *ngIf="pagination?.multiplePages()">
    <mat-icon
            class="pagination-icon"
            fontIcon="keyboard_double_arrow_left"
            (click)="fetch(pagination?.first ?? undefined, 0)"
            [class.disabled]="!pagination?.hasPrev()">
    </mat-icon>
    <mat-icon
            class="pagination-icon"
            fontIcon="chevron_left"
            (click)="fetch(pagination?.prev ?? undefined, page - 1)"
            [class.disabled]="!pagination?.hasPrev()">
    </mat-icon>
    
   <div class="page-info">
      <span class="page-number">{{ page }}</span>
      <span class="page-divider"> / </span>
      <span class="total-pages">{{ pagination?.pages || 1 }}</span>
  </div>
  
    <mat-icon
            class="pagination-icon"
            fontIcon="chevron_right"
            (click)="fetch(pagination?.next ?? undefined, page + 1)"
            [class.disabled]="!pagination?.hasNext()">
    </mat-icon>
    <mat-icon
            class="pagination-icon"
            fontIcon="keyboard_double_arrow_right"
            (click)="fetch(pagination?.last ?? undefined, pagination?.pages || 1)"
            [class.disabled]="!pagination?.hasNext()">
    </mat-icon>
</div>
