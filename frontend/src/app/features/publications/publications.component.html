<card-page 
	[pageTitle]="'PUBLICATIONS.TITLE' | translate"
	[fetchMethod]="fetchPublications"
	[items]="publications"
	[showSearchBar]="true"
	[displaySort]="true"
	[displayGridStyle]="false"
	[cardTemplate]="publicationCardTemplate"
></card-page>

<ng-template #publicationCardTemplate let-publication>
	<publication-card [publication]="publication" [loggedUser]="loggedUser" [showLikeHeart]="true"></publication-card>
</ng-template>
