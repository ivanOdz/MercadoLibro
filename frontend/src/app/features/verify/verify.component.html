<div *ngIf="isVerifying" class="flex justify-content-center align-items-center">
    <p-progressSpinner styleClass="custom-spinner" />
</div>

<!-- Mensaje de éxito -->
@if (verificationSuccess) {
    <p-card class="flex align-items-center justify-content-center w-full h-full success-card">
        <ng-template pTemplate="title">
            <i class="pi pi-check-circle text-green-500 text-3xl"></i>
            ¡Verificación exitosa!
        </ng-template>
        <ng-template pTemplate="content">
            <p>Tu cuenta ha sido verificada con éxito. Ahora puedes acceder a todas las funcionalidades.</p>
            <p-button label="Ir al Inicio" icon="pi pi-home" (click)="goToHome()" class="flex justify-content-center w-full"></p-button>
        </ng-template>
    </p-card>
}

<!-- Mensaje de error -->
@if (verificationFailed) {
    <p-card class="flex align-items-center justify-content-center w-full h-full error-card">
        <ng-template pTemplate="title">
            <i class="pi pi-times-circle text-red-500 text-3xl"></i>
            Error en la verificación
        </ng-template>
        <ng-template pTemplate="content">
            <p-message severity="error" [text]="errorMessage"></p-message>
            <p>Por favor, chequee que el token de verificacion sea correcto</p>
            <p-button label="Ir al Inicio" icon="pi pi-home" (click)="goToHome()" class="flex justify-content-center w-full"></p-button>
        </ng-template>
    </p-card>
}
