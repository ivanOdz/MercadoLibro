<!-- Formulario de Recuperación de Contraseña -->
<div *ngIf="showForm" class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 class="text-900">Recuperar Contraseña</h2>
            <p class="text-600">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <form #forgotForm="ngForm" (ngSubmit)="sendRecoveryCode()">
            <div class="field">
                <label for="email" class="block text-900 font-medium mb-2">Correo Electrónico</label>
                <input id="email" type="email" pInputText [(ngModel)]="email" class="w-full" name="email" required />
            </div>

            <button pButton type="submit" [disabled]="!forgotForm.valid" class="w-full">Enviar Código</button>
        </form>

        <div class="mt-2 text-center">
            <a href="/auth/login" class="text-primary">Volver al inicio de sesión</a>
        </div>
    </div>
</div>

<!-- Tarjeta de Confirmación -->
<div *ngIf="showConfirmation" class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 class="text-900">¡Revisa tu correo!</h2>
            <p class="text-600">{{ message }}</p>
        </div>

        <div class="mt-4 text-center">
            <a href="/auth/login" pButton label="Volver al Login" class="p-button-primary"></a>
        </div>
    </div>
</div>
