<!-- Formulario de Recuperación de Contraseña -->
<div *ngIf="showForm" class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 class="text-900">{{ 'AUTH.RECOVER_PASSWORD' |translate}}</h2>
            <p class="text-600">{{ 'AUTH.RECOVER_PASSWORD_DESCRIPTION' |translate}}</p>
        </div>

        <form #forgotForm="ngForm" (ngSubmit)="sendRecoveryCode()">
            <div class="field">
                <label for="email" class="block text-900 font-medium mb-2">{{ 'AUTH.EMAIL' |translate}}</label>
                <input data-cy="email" id="email" type="email" pInputText [(ngModel)]="email" class="w-full" name="email" required />
            </div>

            <button data-cy="submit" pButton type="submit" [disabled]="!forgotForm.valid" class="w-full">{{ 'AUTH.SEND_CODE' |translate}}</button>
        </form>

        <div class="mt-2 text-center">
            <a href="/auth/login" class="text-primary">{{ 'AUTH.RETURN_LOGIN' |translate}}</a>
        </div>
    </div>
</div>

<!-- Tarjeta de Confirmación -->
<div *ngIf="showConfirmation" class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 data-cy="title-success" class="text-900">{{ 'AUTH.CHECK_YOUR_EMAIL' |translate}}</h2>
            <p class="text-600">{{ message }}</p>
        </div>

        <div class="mt-4 text-center">
            <a href="/auth/login" pButton label="{{ 'AUTH.RETURN_LOGIN' |translate}}" class="p-button-primary"></a>
        </div>
    </div>
</div>
