<div class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 class="text-900">Restablecer Contraseña</h2>
            <p class="text-600">Ingresa el código enviado a tu correo y establece una nueva contraseña.</p>
        </div>

        <form #changeForm="ngForm" (ngSubmit)="changePassword()">
            <!-- Campo para el código de verificación -->
            <div class="field">
                <label for="verificationCode" class="block text-900 font-medium mb-2">Código de Verificación</label>
                <input id="verificationCode" type="text" pInputText [(ngModel)]="passwordCode" class="w-full" name="verificationCode" required />
            </div>

            <!-- Campo para la nueva contraseña -->
            <div class="field">
                <label for="newPassword" class="block text-900 font-medium mb-2">Nueva Contraseña</label>
                <p-password [fluid]="true" [feedback]="false" [toggleMask]="true" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required />
            </div>

            <!-- Confirmación de la nueva contraseña -->
            <div class="field">
                <label for="confirmPassword" class="block text-900 font-medium mb-2">Confirmar Contraseña</label>
                <p-password [fluid]="true" [feedback]="false" [toggleMask]="true" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required />
            </div>

            <button pButton type="submit" [disabled]="!changeForm.valid" class="w-full">Cambiar Contraseña</button>
        </form>

        <div class="mt-2 text-center">
            ¿Has recordado tu contraseña?
            <a href="/auth/login" class="text-primary">Iniciar sesión</a>
        </div>
    </div>
</div>
