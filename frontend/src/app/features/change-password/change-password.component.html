<div class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <div class="text-center mb-4">
            <h2 class="text-900">{{ 'AUTH.REESTABLISH_PASSWORD' |translate}}</h2>
            <p class="text-600">{{ 'AUTH.REESTABLISH_PASSWORD_DESCRIPTION' |translate}}</p>
        </div>

        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
            <!-- Campo para el código de verificación -->
            <div class="field">
                <label formControlName="verificationCode" for="verificationCode" class="block text-900 font-medium mb-2">{{ 'AUTH.VERIFICATION_CODE' |translate}}</label>
                <input id="verificationCode" type="text" pInputText [(ngModel)]="passwordCode" class="w-full" name="verificationCode" required />
                <div *ngIf="passwordForm.get('verificationCode')?.invalid && passwordForm.get('verificationCode')?.touched" class="error" >
                    <small >{{ 'AUTH.INVALID_CODE' |translate}}</small>
                </div>
            </div>

            <!-- Campo para la nueva contraseña -->
            <div class="field">
                <label for="newPassword" class="block text-900 font-medium mb-2">{{ 'AUTH.NEW_PASSWORD' |translate}}</label>
                <input formControlName="password" type="password" pInputText class="w-full" data-cy="new-password"  id="newPassword"  name="newPassword" required />
                <div class="error"  *ngIf="passwordForm.get('password')?.invalid && passwordForm.get('password')?.touched">
                    <small *ngIf="passwordForm.get('password')?.errors?.['required']">{{ 'AUTH.PASSWORD_OBLIGATORY' |translate}}</small>
                </div>
            </div>

            <!-- Confirmación de la nueva contraseña -->
            <div class="field">
                <label for="confirmPassword" class="block text-900 font-medium mb-2">{{ 'AUTH.CONFIRM_PASSWORD' |translate}}</label>
                <input type="password" formControlName="confirmPassword" pInputText class="w-full" data-cy="confirm-password" id="confirmPassword" name="confirmPassword" required />
                <div class="error"  *ngIf="passwordForm.hasError('passwordsMismatch') && passwordForm.get('confirmPassword')?.touched">
                    <small>{{'AUTH.PASSWORDS_NOT_MATCH'|translate}}</small>
                </div>
            </div>

            <button data-cy="submit" pButton type="submit" [disabled]="!passwordForm.valid" class="w-full">{{ 'AUTH.CHANGE_PASSWORD' |translate}}</button>
        </form>

        <div class="mt-2 text-center">
            {{ 'AUTH.REMEMBER_PASSWORD' |translate}}
            <a href="/auth/login" class="text-primary">{{ 'AUTH.RETURN_LOGIN' |translate}}</a>
        </div>
    </div>
</div>
