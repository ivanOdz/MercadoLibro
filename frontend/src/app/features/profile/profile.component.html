<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=edit" />
<app-navbar></app-navbar>
<div class="container">

  <div class="left">
    <div class="box">
      <h2>Mi Perfil</h2>
      <div class="profile-content">
        <img src="assets/profile.png" alt="Profile Image">
        <div class="profile-details">

          <span>
            Usuario: {{ loggedUser?.username }}

            <span *ngIf="loggedUser !== null" class="material-symbols-outlined" (click)="openModal()">edit</span>
          </span>

          <span>Email: {{ loggedUser?.mail }}</span>
          <div class="language-select">
            <span>Idioma: </span>
            <select id="language-select" (change)="updateLanguage($event)">
              <option value="es">Español</option>
              <option value="en">English</option>
            </select>
          </div>

        </div>
      </div>
    </div>
    <div class="box">
      <div class="locations-container">
        <h2>Mis Ubicaciones</h2>

        <div class="locations">
          <span *ngFor="let loc of locations" class="location">
            {{ loc.location }}
            <span class="remove-icon" (click)="removeLocation(loc)">✖</span>
          </span>
        </div>

        <!--<button class="add-button" (click)="addLocation()" [disabled]="loggedUser?.locations.length >= 5">
          + Agregar +
        </button>-->
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="box">
      <h2>Reviews</h2>
      <div class="review-section">
        <app-review></app-review>
      </div>
    </div>
  </div>

  <!-- Username Modal -->
  <div class="modal-overlay" *ngIf="isModalOpen">
    <div class="modal">
      <h3>Editar Username</h3>
      <input type="text" [(ngModel)]="newUsername" placeholder="Nuevo username">
      <div class="modal-buttons">
        <button (click)="closeModal()">Cancelar</button>
        <button (click)="updateUsername()">Aceptar</button>
      </div>
    </div>
  </div>

</div>
