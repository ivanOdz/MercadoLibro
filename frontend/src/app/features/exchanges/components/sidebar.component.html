<div class="sidebar">
    <div class="sidebar-header">
        <p class="sidebar-title">Exchanges</p>
    </div>
    <div class="sidebar-content">
        <ul class="sidebar-list">
            <div *ngFor="let item of items" class="sidebar-item" routerLinkActive="active">
                <p-button class="sidebar-buttons" icon="{{ item.icon }}" label="{{ item.label }}" variant="text" [routerLink]="item.routerLink"/>
            </div>
        </ul>
    </div>
</div>
