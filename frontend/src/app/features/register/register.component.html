<div class="flex align-items-center justify-content-center w-full h-full">
    <div class="surface-card p-4 shadow-2 border-round w-full sm:w-25rem">
        <!-- FORMULARIO (se oculta después del registro exitoso) -->
        <form *ngIf="!isRegistered" #loginForm="ngForm" (ngSubmit)="register()">
            <div class="field">
                <label for="email" class="block text-900 font-medium mb-2">{{ 'AUTH.EMAIL' |translate }}</label>
                <input data-cy='email' id="email" type="email" pInputText [(ngModel)]="email" class="w-full" name="email" required />
            </div>
            <div class="field">
                <label for="username" class="block text-900 font-medium mb-2">{{ 'AUTH.USERNAME' |translate }}</label>
                <input data-cy="username" id="username" type="text" pInputText [(ngModel)]="username" class="w-full" name="username" required />
            </div>
            <div class="field">
                <label for="password" class="block text-900 font-medium mb-2">{{ 'AUTH.PASSWORD' |translate }}</label>
                <p-password data-cy="password" [fluid]="true" [feedback]="false" [toggleMask]="true" id="password" [(ngModel)]="password" name="password" required />
            </div>
            <div class="field">
                <label for="repeatPassword" class="block text-900 font-medium mb-2">{{ 'AUTH.REPEAT_PASSWORD' |translate }}</label>
                <p-password data-cy="repeat-password" [fluid]="true" [feedback]="false" [toggleMask]="true" id="repeatPassword" [(ngModel)]="repeatPassword" name="repeatPassword" required />
            </div>

            <button data-cy="submit" pButton type="submit" [disabled]="!loginForm.valid" class="w-full">{{ 'AUTH.REGISTER' |translate }}</button>
        </form>
        <div class="mt-2 text-center">
            {{ 'AUTH.HAVE_ACCOUNT?' |translate }}
            <a href="/auth/login" class="text-primary">{{ 'AUTH.LOGIN' |translate }}</a>
        </div>
    </div>
</div>
