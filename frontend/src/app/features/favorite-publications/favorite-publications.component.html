<card-page 
	[pageTitle]="'MY_FAVORITE_PUBLICATIONS' | translate"
	[fetchMethod]="fetchMyFavoritePublications"
	[items]="publications"
	[showSearchBar]="false"
	[displaySort]="false"
	[displayGridStyle]="false"
	[cardTemplate]="publicationCardTemplate"
></card-page>

<ng-template #publicationCardTemplate let-publication>
	<publication-card [publication]="publication"></publication-card>
</ng-template>
